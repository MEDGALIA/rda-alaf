name: Stamp verification on approval

# After a PR merges, if it carried an APPROVED review, writes that reviewer
# and the approval date into Verified By/Last Verified for whichever rows
# actually changed in the PR and are still blank. Approving a PR is meant
# to be the act of verifying; nothing wrote that into the data before this.
# See drafts/VANTAGE-Tech-Radar-Sync-Plan.md, Step 4.
#
# Writes to a disposable 'auto-sync' branch, never to main directly: main
# requires a PR, and this repo has no way to grant a bot push access to it
# (tested -- the built-in Actions app cannot be added to
# bypass_pull_request_allowances). auto-sync is unprotected, so the default
# GITHUB_TOKEN can push there with no new credentials. An admin merges
# auto-sync into main whenever convenient -- their existing merge rights
# already cover it.
#
# No loop risk: merging auto-sync into main re-triggers this workflow, but
# content_hash() excludes verified_by/last_verified from what counts as
# "changed", so a stamp-only diff is never seen as new content -- and that
# merge PR has no approval of its own in the common case anyway.
#
# The 'no-verify' PR label skips stamping entirely, for a bulk/mechanical
# edit where approving isn't the curator personally re-checking every row.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-sync
  cancel-in-progress: false

jobs:
  stamp:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'no-verify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: sync

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare auto-sync, up to date with main
        working-directory: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin auto-sync > /dev/null 2>&1; then
            git fetch origin auto-sync
            git checkout -B auto-sync origin/auto-sync
            git merge origin/main --no-edit
          else
            git checkout -B auto-sync origin/main
          fi

      - name: Stamp verification from the approval
        working-directory: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/scripts/stamp_verification.py \
            --base-dir ../base/data/json \
            --write-dir data/json \
            --xlsx data/VANTAGE-Technology-Radar.xlsx \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }}

      - name: Commit and push auto-sync if anything was stamped
        working-directory: sync
        run: |
          git add data/json/ data/VANTAGE-Technology-Radar.xlsx
          if git diff --cached --quiet; then
            echo "Nothing to stamp"
          else
            git commit -m "Stamp verification: PR #${{ github.event.pull_request.number }} [skip ci]"
            git push origin auto-sync
          fi
