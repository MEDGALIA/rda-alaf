name: Sync xlsx to JSON

# When a PR uploads a new data/VANTAGE-Technology-Radar.xlsx, regenerate
# data/json/*.json from it and push that diff into the same PR -- so a
# human uploading the xlsx never has to run xlsx_to_json.py by hand.
#
# github.actor (who pushed the branch) is passed as --actor, so any row
# whose content actually changed gets its Added/Edited By stamped with a
# real GitHub handle rather than trusting whatever a human or agent
# self-declared in the cell.
#
# Limitation: pushes back to the PR's own branch, so this only works for
# PRs opened from a branch in this repo, not from a fork (GITHUB_TOKEN
# has no write access to fork branches).

on:
  pull_request:
    paths:
      - "data/VANTAGE-Technology-Radar.xlsx"

permissions:
  contents: write

jobs:
  sync:
    # Skip the bot's own sync push. GitHub already refuses to start new runs
    # from commits pushed with GITHUB_TOKEN, so this is belt-and-braces --
    # but it must stay a *job-level* guard. Do NOT go back to putting
    # [skip ci] in the commit message: that suppresses every workflow for
    # every later event on the PR, including the post-merge verification
    # stamp, which is exactly how PR #16 silently failed.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r src/scripts/requirements.txt

      - name: Sync xlsx to JSON
        env:
          PR_ACTOR: ${{ github.actor }}
        run: python src/scripts/xlsx_to_json.py --actor "@$PR_ACTOR"

      # Both paths must be staged. xlsx_to_json.py writes back into the
      # workbook too -- blanking cleared verification cells and stamping
      # Added/Edited By. Staging only data/json/ discards those edits when
      # the job ends, leaving the JSON and the xlsx disagreeing.
      - name: Commit and push the sync result if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/json/ data/VANTAGE-Technology-Radar.xlsx
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync data/json/ and workbook from uploaded xlsx"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
